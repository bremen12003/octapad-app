name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Agregar plataforma Android
        run: npx cap add android

      - name: Motor de audio nativo (baja latencia)
        run: |
          MA=$(find android/app/src/main/java -name MainActivity.java | head -1)
          DIR=$(dirname "$MA")
          PKG=$(grep -m1 '^package' "$MA" | sed 's/package \(.*\);/\1/')
          echo "Paquete: $PKG"
          for f in NAMixer NativeAudioEngine NativeAudioPlugin; do
            sed "s/PACKAGE_PLACEHOLDER/$PKG/" native/$f.java > "$DIR/$f.java"
          done
          cat > "$MA" <<EOF
          package $PKG;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(NativeAudioPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
          echo "--- MainActivity ---"
          cat "$MA"
          ls -la "$DIR"

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Dar permisos a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: octapad-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
